{{- /* Optional HuggingFace token, as the official llama.cpp / vLLM charts do. */ -}}
{{- $hfToken := .Values.olaresEnv.HF_TOKEN | default "" -}}
{{- if $hfToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  HF_TOKEN: "{{ $hfToken }}"
{{- end -}}
